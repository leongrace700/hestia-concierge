<script>

    function switchTab(tab) {

      document.querySelectorAll('.portal-nav-btn').forEach(btn => {

        btn.classList.remove('text-hestia-gold', 'bg-white/5');

        btn.classList.add('text-white/70');

      });



      document.getElementById('portal-acceso').classList.add('hidden');

      document.getElementById('portal-servicios').classList.add('hidden');

      document.getElementById('portal-roomservice').classList.add('hidden');

      document.getElementById('portal-invitados').classList.add('hidden');

      document.getElementById('portal-chat').classList.add('hidden');



      const activeBtn = document.getElementById(`nav-${tab}`);

      if (activeBtn) {

        activeBtn.classList.add('text-hestia-gold', 'bg-white/5');

        activeBtn.classList.remove('text-white/70');

      }



      document.getElementById(`portal-${tab}`).classList.remove('hidden');

    }



    // Login Form

    document.getElementById('portal-login-form').addEventListener('submit', (e) => {

      e.preventDefault();

      const btn = document.getElementById('btn-portal-login');

      btn.innerText = 'VALIDANDO RESERVA...';

      setTimeout(() => {

        btn.innerText = 'INGRESAR AL PORTAL';

        switchTab('servicios');

      }, 600);

    });



    // Chat Form

    document.getElementById('chat-form').addEventListener('submit', (e) => {

      e.preventDefault();

      const input = document.getElementById('chat-input');

      const text = input.value.trim();

      if (!text) return;



      const chatMessages = document.getElementById('chat-messages');

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });



      chatMessages.innerHTML += `

        <div class="flex items-start justify-end gap-2">

          <div class="bg-hestia-dark text-white p-3 rounded-2xl max-w-sm shadow-sm">

            <p class="font-medium">${text}</p>

            <span class="text-[9px] text-hestia-gold/80 mt-1 block text-right">Usted • ${now}</span>

          </div>

        </div>

      `;

      input.value = '';

      chatMessages.scrollTop = chatMessages.scrollHeight;



      setTimeout(() => {

        chatMessages.innerHTML += `

          <div class="flex items-start gap-2">

            <div class="bg-white border border-hestia-border p-3 rounded-2xl max-w-sm shadow-sm">

              <p class="text-hestia-dark font-medium">Recibido. Un miembro de nuestro equipo ya está gestionando su solicitud.</p>

              <span class="text-[9px] text-hestia-dark/50 mt-1 block text-right">Concierge • Ahora</span>

            </div>

          </div>

        `;

        chatMessages.scrollTop = chatMessages.scrollHeight;

      }, 1000);

    });



    // LÓGICA DE INVITADOS & AFORO

    const formInvitados = document.getElementById('form-invitados');

    const guestsList = document.getElementById('guests-list');

    const capacityBadge = document.getElementById('capacity-badge');



    function updateCapacity() {

      const currentGuests = guestsList.querySelectorAll('.guest-card').length;

      capacityBadge.innerText = `${currentGuests} / 4`;

      if (currentGuests >= 4) {

        capacityBadge.classList.replace('text-hestia-gold', 'text-red-400');

      } else {

        capacityBadge.classList.replace('text-red-400', 'text-hestia-gold');

      }

    }



    formInvitados.addEventListener('submit', (e) => {

      e.preventDefault();

      const currentCount = guestsList.querySelectorAll('.guest-card').length;

      if (currentCount >= 4) {

        alert('Se ha alcanzado el aforo máximo permitido para la Suite (4 personas).');

        return;

      }



      const name = document.getElementById('guest-name-input').value.trim();

      const docType = document.getElementById('guest-doc-type').value;

      const docNum = document.getElementById('guest-doc-num').value.trim();

      const passType = document.getElementById('guest-pass-type').value;



      const maskedDoc = docNum.length > 4 ? `•••• ${docNum.slice(-4)}` : docNum;



      const newCard = document.createElement('div');

      newCard.className = 'guest-card bg-hestia-cream/50 border border-hestia-border rounded-xl p-4 flex items-center justify-between gap-4 transition-all';

      newCard.innerHTML = `

        <div>

          <h6 class="text-sm font-bold text-hestia-dark m-0">${name}</h6>

          <p class="text-xs text-hestia-dark/60 m-0">${docType} ${maskedDoc} • ${passType}</p>

          <span class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800">● Acceso Pendiente</span>

        </div>

        <button onclick="revokeGuest(this)" class="px-3 py-1.5 border border-red-200 text-red-600 text-xs font-bold rounded-lg hover:bg-red-50 transition-colors">Revocar</button>

      `;



      guestsList.appendChild(newCard);

      formInvitados.reset();

      updateCapacity();

    });



    function revokeGuest(button) {

      const card = button.closest('.guest-card');

      if (card) {

        card.remove();

        updateCapacity();

      }

    }



    // LÓGICA DE ROOM SERVICE & CARRITO

    let cart = [];



    function filterCategory(cat) {

      document.querySelectorAll('.cat-filter-btn').forEach(btn => {

        btn.classList.remove('bg-hestia-dark', 'text-hestia-gold', 'border-hestia-gold');

        btn.classList.add('bg-white', 'text-hestia-dark', 'border-hestia-border');

      });

      event.target.classList.add('bg-hestia-dark', 'text-hestia-gold', 'border-hestia-gold');

      event.target.classList.remove('bg-white', 'text-hestia-dark', 'border-hestia-border');



      const items = document.querySelectorAll('.menu-card');

      items.forEach(item => {

        if (cat === 'todos' || item.getAttribute('data-category') === cat) {

          item.classList.remove('hidden');

        } else {

          item.classList.add('hidden');

        }

      });

    }



    function addToCart(title, price) {

      cart.push({ title, price });

      renderCart();

    }



    function removeFromCart(index) {

      cart.splice(index, 1);

      renderCart();

    }



    function renderCart() {

      const container = document.getElementById('cart-items-container');

      const counterBadge = document.getElementById('cart-counter-badge');

      const summaryCount = document.getElementById('summary-items-count');

      const summaryTotal = document.getElementById('summary-total-price');

      const btnCheckout = document.getElementById('btn-checkout');



      counterBadge.innerText = `🛒 ${cart.length} items`;

      summaryCount.innerText = `${cart.length} seleccionados`;



      if (cart.length === 0) {

        container.innerHTML = '<p id="empty-cart-msg" class="text-xs text-hestia-dark/50 text-center py-8">No hay platillos seleccionados.</p>';

        summaryTotal.innerText = '$0 COP';

        btnCheckout.disabled = true;

        btnCheckout.classList.add('opacity-50', 'cursor-not-allowed');

        return;

      }



      btnCheckout.disabled = false;

      btnCheckout.classList.remove('opacity-50', 'cursor-not-allowed');



      let total = 0;

      container.innerHTML = '';



      cart.forEach((item, index) => {

        total += item.price;

        const row = document.createElement('div');

        row.className = 'flex items-center justify-between gap-2 p-2 rounded-lg bg-hestia-cream border border-hestia-border text-xs';

        row.innerHTML = `

          <div class="overflow-hidden">

            <span class="font-bold text-hestia-dark truncate block">${item.title}</span>

            <span class="text-[11px] text-hestia-dark/60">$${item.price.toLocaleString('es-CO')} COP</span>

          </div>

          <button onclick="removeFromCart(${index})" class="text-red-500 font-bold hover:opacity-80 px-2 py-1 text-xs">✕</button>

        `;

        container.appendChild(row);

      });



      summaryTotal.innerText = `$${total.toLocaleString('es-CO')} COP`;

    }



    function checkoutOrder() {

      if (cart.length === 0) return;

      const total = cart.reduce((acc, item) => acc + item.price, 0);

      alert(`¡Orden enviada a cocina! Pedido confirmado para la Suite por valor de $${total.toLocaleString('es-CO')} COP. Tiempo estimado: 25 minutos.`);

      cart = [];

      renderCart();

    }

  </script>
